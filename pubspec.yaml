name: small_memo
description: A small todo list with optional personal sync for iOS, Android, Windows, and Linux.
publish_to: none
version: 0.3.0+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  hotkey_manager: ^0.2.3
  path_provider: ^2.1.5
  supabase_flutter: ^2.18.0
  uuid: ^4.5.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
